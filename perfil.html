
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <header class="perfil-header">
        <a href="principal.html">Inicio</a>
        <nav>
            <a href="perfil.html" aria-current="page">Mi perfil</a>
            <a href="principal.html">Volver</a>
        </nav>
    </header>

    <main class="perfil-container">
        <section class="perfil-card">
            <h1>Mi perfil</h1>
            <p>Consulta y actualiza tus datos personales.</p>

            <form id="perfil-form">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre"
                       type="text" maxlength="100" required>

                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo"
                       type="email" maxlength="254" required>

                <label for="telefono">Teléfono (opcional)</label>
                <input id="telefono" name="telefono"
                       type="tel" maxlength="25">

                <button type="submit">Guardar cambios</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="perfil-footer">
        <p>Mi perfil de usuario</p>
    </footer>

    <script src="perfil.js"></script>
</body>
</html>
